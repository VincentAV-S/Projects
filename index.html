    :root{
      --bg:#0f1115;           /* deep gray */
      --panel:#141820;        /* card background */
      --muted:#97a0af;        /* secondary text */
      --text:#e7e9ee;         /* primary text */
      --accent:#6ee7ff;       /* links, accents */
      --chip:#242938;         /* tag chip bg */
      --chipText:#cfd6e6;
      --border:#222737;       /* subtle borders */
      --shadow:0 6px 18px rgba(0,0,0,.35);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif;
      letter-spacing:.2px;
    }
    a{color:var(--accent); text-decoration:none}
    a:hover{text-decoration:underline}

    /* --- Compact header to match Portfolio Projects page --- */
    .site {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: saturate(1.1) blur(6px);
      background: linear-gradient(180deg, rgba(15,17,21,.96), rgba(15,17,21,.78));
      border-bottom: 1px solid var(--border);
    }
    /* Smooth slide-away header */
    .site{
      transition: transform .36s ease, opacity .36s ease;
    }
    .site.off{
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 6px 12px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .avatar{
      width:28px; height:28px; border-radius:6px; flex:0 0 auto; background:#2b2f3d;
      background-size:cover; background-position:center; border:1px solid var(--border);
      background-image:url('avatar.jpg'); /* replace if needed */
    }
    .title{font-weight:700; font-size:15px; margin:0}
    .subtitle{margin:0; font-size:10.5px; color:var(--muted)}

    /* List */
    .list {
        max-width: 1100px;
        margin: 18px auto;
        padding: 0 18px;
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr;
      }
      
      /* Tablet */
      @media (min-width: 700px) {
        .list {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      
      /* Desktop */
      @media (min-width: 1024px) {
        .list {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    .item{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
    .itemHeader{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
    .item h3{margin:0; font-size:18px}
    .meta{color:var(--muted); font-size:12px}
    .desc{margin:10px 0 14px; color:#d7dbe5}
    .actions{display:flex; gap:10px; flex-wrap:wrap}
    .btn{background:#1d2230; border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:10px; font-size:14px; cursor:pointer}
    .btn:hover{border-color:#3a4360}

    .pdfPreview {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #0c0f14;
      aspect-ratio: 8.5 / 11;
      position: relative;
    }
    
    .pdfPreview img {
     width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    }
    .pdfFallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    background: #0c0f14;
    text-align: center;
    padding: 10px;
    }

    .articleList {
  margin: 10px 0 14px;
    }
    
    .articleLabel {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    
    .articleList ul {
      margin: 0;
      padding-left: 0;
      list-style: none; /* removes bullets */
    }
    
    .articleList li {
      margin: 3px 0;
      line-height: 1.4;
    }

    .navBtn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      border: none;
      color: white;
      font-size: 20px;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 6px;
    }
  
  .navBtn.left { left: 8px; }
  .navBtn.right { right: 8px; }
  


    /* Footer */
    footer{max-width:1100px; margin:40px auto 60px; padding:0 18px; color:var(--muted); font-size:12px}

    /* Small screens */
    @media (max-width:640px){
      .avatar{width:28px; height:28px}
      .title{font-size:15px}
      .desc{font-size:14px}
    
    }
  </style>

const list = document.getElementById('list');

/* ===== IMAGE LIST ===== */
function getImageList(item){
  const base = item.url.replace('.pdf','');
  const images = [];

  for(let i = 0; i < 50; i++){ // safe upper bound
    images.push(`images/${base}_p${String(i).padStart(3,'0')}.webp`);
  }

  return images;
}

/* ===== CAROUSEL ===== */
function createCarousel(images, title){
  const container = document.createElement('div');
  container.className = 'pdfPreview';

  let index = 0;
  const img = document.createElement('img');
  img.alt = title;

function load(i){
  img.src = images[i];

  img.onerror = () => {
    if(i === 0){
      fallback.style.display = 'flex';
      img.style.display = 'none';
    } else {
      index--; // step back to last valid page
    }
  };
}

  const prev = document.createElement('button');
  prev.textContent = '‹';
  prev.className = 'navBtn left';
  prev.onclick = () => { if(index > 0){ index--; load(index); } };

  const next = document.createElement('button');
  next.textContent = '›';
  next.className = 'navBtn right';
  next.onclick = () => {
  if(index < images.length - 1){
    index++;
    load(index);
    }
  };

  const fallback = document.createElement('div');
  fallback.className = 'pdfFallback';
  fallback.style.display = 'none';
  fallback.textContent = 'Preview unavailable';

  container.append(img, prev, next, fallback);
  load(index);

  return container;
}

/* ===== RENDER ===== */
function render(){
  const sorted = [...ITEMS].sort((a,b)=> new Date(b.date) - new Date(a.date));
  list.innerHTML = '';

  sorted.forEach(item=>{
    const el = document.createElement('article');
    el.className='item';

    const d = new Date(item.date);
    const dateText = d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});

    el.innerHTML = `
      <div class="itemHeader">
        <h3>${item.title}</h3>
        <div class="meta">${dateText}</div>
      </div>

      <div class="articleList">
        <div class="articleLabel">Articles</div>
        <ul>
          ${item.articles.map((a,i)=> `<li>${i+1}. ${a}</li>`).join('')}
        </ul>
      </div>

      <div class="actions">
        <a class="btn" href="${item.url}" download>Download PDF</a>
        <a class="btn" href="${item.url}" target="_blank">Open in New Tab</a>
      </div>
    `;

    const carousel = createCarousel(getImageList(item), item.title);
    el.insertBefore(carousel, el.querySelector('.actions'));

    list.appendChild(el);
  });
}
